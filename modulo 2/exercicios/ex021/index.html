<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxLevel</title>
    <style>

        h1{ 
            width: 300px;
            height: 300px;
            
            /*border-width: 30px;
              border-style: solid;
              border-color:blue; 
            Para fazermos a shorthand usamos apenas ==> border e fazemos na ordem width, style e color. Exemplo abaixo
            */
            border:  30px solid blue; 

            /*para fazer o shorthande de padding, seguimos a mesma lógica ==> top, right, bottom e left. Exemplo abaixo 
                padding-top: 10px;
                padding-right: 10px;
                padding-bottom: 10px;
                padding-left: 10px;

            */
            
            padding: 10px /*<!-- top -->*/ 10px /*<!-- right -->*/ 10px /*<!-- bottom -->*/ 10px /*<!-- left -->*/ ;


             /*para fazer o shorthande de margin, seguimos a mesma lógica ==> top, right, bottom e left. Exemplo abaixo 
                margin-top: 20px;
                margin-right: 20px;
                margin-bottom: 20px;
                margin-left: 20px;

            */ 
            
            margin: 20px /*<!-- top -->*/ 20px /*<!-- right -->*/ 20px /*<!-- bottom -->*/ 20px /*<!-- left -->*/ ; 

            outline-width: 20px;
            outline-color: red;
            outline-style: dashed; 

            
            
        }

        p{ 
            border-width: 10px;
            border-color: red;
            border-style: solid; 
            border-radius: 10px; 
            margin: 20px 20px 20px 20px;
            padding: 20px 20px 20px 20px;
        }

    </style>
</head>
<body>
    <h1>Caixas BoxLevel</h1>
    <p>Paragrafos são exemplo de caixas boxlevel e os <a href="#">links são exemplos de caixas inlinelevel</a>. Vamos ver melhor como funciona isso </p>
</body>
</html>

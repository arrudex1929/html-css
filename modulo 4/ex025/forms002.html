<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms002</title>
</head>
<body>
    <h1>Mais um forms</h1> 
    <form action="index.php" method="get" autocomplete="on">
       
       <p>
        <label for="iname">Aluno:</label>
        <input type="text" name="name" id="iname" required maxlength="15" size="16" autocomplete="name">
       </p>

        <p>
            <label for="imed">Media</label>
            <input type="number" name="med" id="imed" required min="0" max="10" placeholder="0 à 10" step="0.1">
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" id="imes" placeholder="digite o mes">
        </p>

        <p>
            <label for="idia">Dia da prova</label>
            <input type="date" name="dia" id="idia">
        </p>

        <p>
            <label for="ihor">Horário da Prova</label>
            <input type="time"  name="hor"  id="ihor">
        </p>


        <p>
            <input type="submit" value="send">
            <input type="reset" value="clean">

        </p>

    </form>
</body>
</html>

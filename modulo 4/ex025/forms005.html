<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário exemplo</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1> 
    
        <form action="index.php" method="post" autocomplete="on">
            
            <fieldset>
                <legend>sexo</legend>
                <input type="radio" name="sexo" id="imasc" checked><label for="imasc">Masculino</label>
                <input type="radio" name="sexo" id="ifem"><label for="ifem">Feminino</label> 

                <!--Todo "name" do radio precisa ter o mesmo nome para que seja possível marcar as bolinhas diferentes. qualquer duvida testar com o name igual e diferente para verificar o resultaodo. 
                
                checked - serve para deixar marcado como padrão. 
                -->
            </fieldset>
            
            <fieldset>
                <legend>Esportes Favoritos</legend>
                <p>
                   <input type="checkbox" name="fut" id="ifut" ><label for="ifut">Futebol</label> <br>
                   <input type="checkbox" name="bas" id="ibas" ><label for="ibas">Basebol</label> <br>
                   <input type="checkbox" name="nat" id="inat" ><label for="inat">Natação</label> <br>
                   <input type="checkbox" name="basq" id="ibasq" ><label for="ibasq">Basquete</label>
                </p>
                <p>
                    <input type="submit"   value="enviar">
                    <input type="reset" value="limpar">
                </p>
            </fieldset>
        </form>
    
</body>
</html>

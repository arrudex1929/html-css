<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário </title>
</head>
<body>
    <h1>Exemplo de forms</h1> 
    <form action="index.php" method="get" autocomplete="on">

       <p>
        <input type="color" name="cor" id="icor"><label for="icor">Cor</label>
       </p>
       
       <p>
        <label for="inivel">Nivel de satisfação</label>
        <input type="range" name="nivel" id="inivel" min="1"  max="10" value="1"> 
       </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>

        <p>
            <label for="ifoto">Envie sua foto</label>
            <input type="file" name="foto"  id="ifoto">
        </p>


            <!--Quando utilizarmos o input file é preciso utilizar o método POST para garantir segurança -->
    </form>
</body>
</html>
